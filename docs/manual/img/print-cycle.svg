<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Each layer is cured, peeled and stepped up until the last one" font-family="IBM Plex Sans, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<title>Each layer is cured, peeled and stepped up until the last one</title>
<rect width="760" height="470" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c9a90"/></marker></defs>
<text x="24" y="34" text-anchor="start" fill="#1c1c1a" font-weight="600" font-size="15">Each layer is cured, peeled and stepped up until the last one</text>
<g fill="none" stroke="#9c9a90" stroke-width="1.25"><path d="M107 100V134" marker-end="url(#arrow)"/><path d="M186 170H210" marker-end="url(#arrow)"/><path d="M368 170H392" marker-end="url(#arrow)"/><path d="M550 170H574" marker-end="url(#arrow)"/><path d="M653 206V264" marker-end="url(#arrow)"/><path d="M589 300H550" marker-end="url(#arrow)"/><path d="M392 300H368" marker-end="url(#arrow)"/><path d="M210 300H186" marker-end="url(#arrow)"/><path d="M107 272V206" marker-end="url(#arrow)"/><path d="M653 336V374" marker-end="url(#arrow)"/></g>
<path d="M289 328V374" fill="none" stroke="#9c9a90" stroke-width="1.25" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="24" y="64" width="240" height="36" rx="8" fill="none" stroke="#9c9a90" stroke-width="1.25"/>
<text x="144" y="86" text-anchor="middle" fill="#1c1c1a">Start print, approach layer 1</text>
<rect x="28.0" y="134" width="158" height="72" rx="8" fill="none" stroke="#9c9a90" stroke-width="1.25"/><text x="107" y="158" text-anchor="middle" fill="#1c1c1a" font-weight="600">Settle</text><text x="107" y="174" text-anchor="middle" fill="#5c5c57" font-size="11.5">wait before exposure</text><text x="107" y="190" text-anchor="middle" fill="#5c5c57" font-size="11.5">mask up, LED off</text>
<rect x="210.0" y="134" width="158" height="72" rx="8" fill="#2f6fd0" fill-opacity="0.12" stroke="#2f6fd0" stroke-width="2"/><text x="289" y="158" text-anchor="middle" fill="#1c1c1a" font-weight="600">Expose</text><text x="289" y="174" text-anchor="middle" fill="#1c1c1a" font-size="11.5">LED on, job's level</text><text x="289" y="190" text-anchor="middle" fill="#1c1c1a" font-size="11.5">for the layer's time</text>
<rect x="392.0" y="134" width="158" height="72" rx="8" fill="none" stroke="#9c9a90" stroke-width="1.25"/><text x="471" y="158" text-anchor="middle" fill="#1c1c1a" font-weight="600">Laser lines</text><text x="471" y="174" text-anchor="middle" fill="#5c5c57" font-size="11.5">only on layers</text><text x="471" y="190" text-anchor="middle" fill="#5c5c57" font-size="11.5">that have lines</text>
<rect x="574.0" y="134" width="158" height="72" rx="8" fill="none" stroke="#9c9a90" stroke-width="1.25"/><text x="653" y="158" text-anchor="middle" fill="#1c1c1a" font-weight="600">After exposure</text><text x="653" y="174" text-anchor="middle" fill="#5c5c57" font-size="11.5">wait, then the next</text><text x="653" y="190" text-anchor="middle" fill="#5c5c57" font-size="11.5">mask goes up</text>
<polygon points="589,300 653,264 717,300 653,336" fill="none" stroke="#9c9a90" stroke-width="1.25"/>
<text x="653" y="304" text-anchor="middle" fill="#1c1c1a">Last layer?</text>
<rect x="392.0" y="272" width="158" height="56" rx="8" fill="none" stroke="#9c9a90" stroke-width="1.25"/><text x="471" y="296" text-anchor="middle" fill="#1c1c1a" font-weight="600">Lift</text><text x="471" y="312" text-anchor="middle" fill="#5c5c57" font-size="11.5">slow peel, then fast</text>
<rect x="210.0" y="272" width="158" height="56" rx="8" fill="none" stroke="#9c9a90" stroke-width="1.25"/><text x="289" y="296" text-anchor="middle" fill="#1c1c1a" font-weight="600">Wait after lift</text><text x="289" y="312" text-anchor="middle" fill="#5c5c57" font-size="11.5">a pause starts here</text>
<rect x="28.0" y="272" width="158" height="56" rx="8" fill="none" stroke="#9c9a90" stroke-width="1.25"/><text x="107" y="296" text-anchor="middle" fill="#1c1c1a" font-weight="600">Retract</text><text x="107" y="312" text-anchor="middle" fill="#5c5c57" font-size="11.5">fast, then slow</text>
<rect x="210.0" y="374" width="158" height="72" rx="8" fill="none" stroke="#9c9a90" stroke-width="1.25"/><text x="289" y="398" text-anchor="middle" fill="#1c1c1a" font-weight="600">Paused</text><text x="289" y="414" text-anchor="middle" fill="#5c5c57" font-size="11.5">plate up to the top</text><text x="289" y="430" text-anchor="middle" fill="#5c5c57" font-size="11.5">until Resume</text>
<rect x="574.0" y="374" width="158" height="72" rx="8" fill="none" stroke="#9c9a90" stroke-width="1.25"/><text x="653" y="398" text-anchor="middle" fill="#1c1c1a" font-weight="600">End of print</text><text x="653" y="414" text-anchor="middle" fill="#5c5c57" font-size="11.5">peel, then up to</text><text x="653" y="430" text-anchor="middle" fill="#5c5c57" font-size="11.5">the top limit</text>
<text x="570" y="291" text-anchor="middle" fill="#5c5c57" font-size="11.5">no</text>
<text x="662" y="359" text-anchor="start" fill="#5c5c57" font-size="11.5">yes</text>
<text x="298" y="357" text-anchor="start" fill="#5c5c57" font-size="11.5">Pause after layer</text>
</svg>